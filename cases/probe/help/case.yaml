#   probe: the help short-circuit -- "--help" must output the manual page
#   of the skill verbatim and stop before anything is minted
skill: ase-meta-mint
args: "--help"
runs: 3
minPass: 2
timeoutSec: 180
budget: { maxUsd: 1.00 }
oracles:
  - notErrored: true
  - regex:
      in: output
      match:
        - "##\\s+NAME"
        - "##\\s+SYNOPSIS"
        - "--count"
      not:
        - "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
        - "@\\S*help\\.md"
