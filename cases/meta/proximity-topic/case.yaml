skill: ase-meta-proximity
args: "property-based testing"
runs: 3
minPass: 2
timeoutSec: 480
budget: { maxUsd: 1.50 }
oracles:
  - notErrored: true
  - regex:
      in: output
      match:
        - "PARENT"
        - "SIBLINGS"
        - "CHILDREN"
  - rubric:
      file: rubric.md
      threshold: 0.7
