skill: ase-arch-discover
args: "--limit 6 retrying failed HTTP requests with exponential backoff and jitter for the fetch calls of the relay"
runs: 1
timeoutSec: 900
budget: { maxUsd: 3.00 }
fixture:
  git: true
  files: fixture/tree
oracles:
  - notErrored: true
  - gitDiff: { empty: true }
  - regex:
      in: output
      match:
        - "COMPONENT RANKING"
        - "p-retry|fetch-retry|exponential-backoff|async-retry|cockatiel|ky|got|undici"
  - rubric:
      file: rubric.md
      threshold: 0.7
