#   review benchmark case "security-refunds" of "ase-repo-review" (see "docs/review/README.md"):
#   a base commit plus a change commit with seeded defects and decoys, reviewed
#   read-only and scored deterministically against "solution/expected.json"
skill: ase-repo-review
args: "-c HEAD -S LOW"
runs: 3
minPass: 2
timeoutSec: 1200
budget: { maxUsd: 5.00 }
disallowedTools: [ Edit, Write, NotebookEdit, WebFetch, WebSearch ]
fixture:
    git: true
    config: { project: { id: shop, name: Shop, boxing: white } }
    files: fixture/base
    #   the fixture declares "typescript" without installing it: link the one of
    #   the harness, so a session can type-check instead of searching the host
    nodeModules: [ typescript ]
    change:
        files:   fixture/change
        delete:  fixture/change.delete
        message: "Add admin refunds and payment webhooks"
oracles:
    - notErrored: true
    - gitDiff: { empty: true }
    - review:
          in:         output
          expected:   solution/expected.json
          thresholds: thresholds.json
