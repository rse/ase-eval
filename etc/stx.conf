#   [test] static code analysis (linting)
lint
    eslint --config etc/eslint.mjs src/*.ts && \
    tsc --project etc/tsc.json

#   [test] run the skill test harness (arguments: case globs and options)
test
    node --import tsx src/ase-test.ts $*

#   [test] compare the summaries of past harness runs (free; writes results/COMPARISON.{md,html})
compare
    node --import tsx src/ase-test-compare.ts $*

#   [test] interactively pick cases and models, then run them in parallel (burns AI tokens)
launch
    node --import tsx src/ase-test-launch.ts $*

#   [test] run the end-to-end test of "ase agent" (burns AI tokens, see agent/README.md)
test-agent
    node agent/ase-agent-test.mts $*

#   [test] self-test of the review benchmark (parser, matching, metrics, runner, lists, proofs; free)
review-selftest
    node src/review/selftest.mjs

#   [test] language check of the review benchmark (code, cases, and documentation; free)
review-check-language
    node src/review/check-language.mjs

#   [test] remove the leftover sandboxes (and their services) of killed harness runs (free)
clean-sandboxes
    bash etc/clean-sandboxes.sh $*

#   [test] remove regularly built files
clean
    shx rm -rf results

#   [test] remove all built files
distclean: clean
    shx rm -f package-lock.json && \
    shx rm -rf node_modules
