skill: ase-meta-why
args: "--depth 5 --width 2 Our nightly CI pipeline has failed on three of the last five nights with 'disk quota exceeded' on the shared build runner, although each job deletes its workspace at the end."
runs: 1
timeoutSec: 600
budget: { maxUsd: 2.00 }
oracles:
  - notErrored: true
  - regex:
      in: output
      match:
        - "PROBLEM"
        - "SOLUTION"
  - rubric:
      file: rubric.md
      threshold: 0.7
