#   the gateway behind the sandboxes offers no web search backend, so the
#   research must stop with the missing-backend error, without inventing
#   findings and without touching the plan
skill: ase-task-research
args: "csvparse: which CSV parser fits our import, given the current code"
runs: 2
minPass: 1
timeoutSec: 900
budget: { maxUsd: 3.00 }
fixture:
  git: true
  files: fixture/tree
  lifecycle: solo
  tasks:
    - fixture/TASK-csvparse.md
oracles:
  - regex:
      in: output
      match:
        - "ERROR: no search backend available"
      not:
        - "https?://"
        - "RESEARCH REPORT|Findings:"
  - check:
      label: "the plan was left unchanged"
      command: "cmp -s .ase/task/TASK-csvparse.md \"$CASE_DIR/fixture/TASK-csvparse.md\""
