#   workflow regression "csvq-grill": a vague CSV-tool request through the
#   ASE workflow -- plan editing, grilling, and implementation -- with the
#   guarded spec-holding user simulated by claude-opus-5-5 in the interactive
#   stages; doubles as the ASE arm of the uplift benchmark (see
#   "uplift/README.md" and "run_uplift_test.sh")
stages:
  - skill: ase-task-edit
    args: >-
      --next DONE csvq: I need a small command line tool "csvq.py" (plain
      Python 3, standard library only) to work with CSV files: select
      columns, filter rows, and compute simple statistics. A file
      "sample.csv" in the project shows the kind of data it has to handle.
      The tool must read the CSV data from stdin and write its result to
      stdout.
    timeoutSec: 900
    budget: { maxUsd: 2.00 }
    turns:
      simulator: llm
      persona: persona.md
      model: claude-opus-5-5
      maxTurns: 8
    oracles:
      - taskStore:
          id: csvq
          exists: true
  - skill: ase-task-grill
    args: "--rounds 2 --until MAY --next DONE csvq"
    timeoutSec: 900
    budget: { maxUsd: 4.00 }
    turns:
      simulator: llm
      persona: persona.md
      model: claude-opus-5-5
      maxTurns: 10
    oracles:
      - regex:
          in: output
          match: "GRILLING"
  - skill: ase-task-implement
    args: "--next DONE csvq"
    timeoutSec: 900
    #   a single-shot stage, whose default cap of 32 agentic turns a model
    #   working in many small edits (and test runs) reaches while progressing
    maxAgentTurns: 64
    budget: { maxUsd: 3.00 }
    oracles:
      - fileExists: csvq.py
runs: 2
minPass: 1
fixture:
  git: true
  lifecycle: solo
  files: fixture/tree
  config:
    project:
      task:
        default:
          changeset: worktree
oracles:
  - notErrored: true
  - fileExists: csvq.py
  - exec:
      command:   "python3 csvq.py select name,comment"
      reference: "python3 oracle.py select name,comment"
      stdin:
        - |
          name,team,points,comment
          Alice,Red,12,"likes ""quotes"" a lot"
          Bob,Blue,7,"comma, inside"
          Carla,Red,9,
          Eve,Green,11,"two
          lines"
        - |
          comment,name
          plain,Dan
  - exec:
      command:   "python3 csvq.py filter 'points>9'"
      reference: "python3 oracle.py filter 'points>9'"
      stdin:
        - |
          name,team,points,comment
          Alice,Red,12,"likes ""quotes"" a lot"
          Bob,Blue,7,"comma, inside"
          Carla,Red,9,
          Dan,Blue,15,plain
        - |
          points,name
          3,a
          10,b
  - exec:
      command:   "python3 csvq.py avg points"
      reference: "python3 oracle.py avg points"
      stdin:
        - |
          name,points
          a,12
          b,7
          c,9
          d,15
          e,11
        - |
          points
          2.5
          3
  - suite:
      dir: suite
