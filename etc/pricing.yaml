##
##  pricing.yaml -- per-model token prices (USD per million tokens) of the
##  gateway models the agent tool cannot price itself (their SDK result
##  messages carry "costBasis: unknown" and a fallback-priced "costUSD"),
##  used by the harness to recompute the real cost from the token usage
##  and to scale the SDK budget cap accordingly
##
##  Models without an entry stay "unpriced": their (fallback) SDK cost is
##  kept and flagged as such in the summary. Verify all prices against the
##  price list of your gateway before relying on the cost ceiling.
##

#   the fallback prices of the agent tool for an unrecognized model
#   (derived exactly from the token usage and "costUSD" of gpt-oss runs)
fallback:
    inUsdPerM:          4.00
    outUsdPerM:         20.00
    cacheReadUsdPerM:   0.20

#   the real prices of the gateway models, from the gateway price list
#   (cache prices default to 10% resp. 125% of the input price when omitted,
#   i.e. for the models whose cache prices the gateway does not set)
models:
    "global.openai.gpt-6-astra":
        inUsdPerM:          10.00
        outUsdPerM:         50.00
        cacheReadUsdPerM:   1.00
        cacheWriteUsdPerM:  12.50
    "global.openai.gpt-6-sol":
        inUsdPerM:          2.00
        outUsdPerM:         10.00
        cacheReadUsdPerM:   0.20
        cacheWriteUsdPerM:  2.50
    "global.moonshotai.kimi-k3.1":
        inUsdPerM:          4.00
        outUsdPerM:         20.00
        cacheReadUsdPerM:   0.20
        cacheWriteUsdPerM:  5.00
    "openai.gpt-oss-120b-1:0":
        inUsdPerM:          0.15
        outUsdPerM:         0.60
    "qwen.qwen3-235b-a22b-2507-v1:0":
        inUsdPerM:          0.22
        outUsdPerM:         0.88
    #   the reference models (judge, simulator, and the Opus runner): the agent
    #   tool prices them itself, so these entries only price the live usage of
    #   an aborted session as its lower bound (the gateway prices; the 1-hour
    #   cache write price of $8.80 has no key, the 5-minute one is used)
    "eu.anthropic.claude-opus-5-5":
        inUsdPerM:          4.40
        outUsdPerM:         22.00
        cacheReadUsdPerM:   0.22
        cacheWriteUsdPerM:  5.50
    "eu.anthropic.claude-sonnet-5":
        inUsdPerM:          2.00
        outUsdPerM:         10.00
